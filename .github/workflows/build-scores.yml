name: Build scores

# For every health tenant in dashboard/config/tenants.json: pre-computes scores and
# page-ready views (`views/`) from the CSVs its data_source.yaml names (openedx reads
# openedx/wg-maintenance) so readers render files instead of running scoring.
# Output goes to <org>/ on the orphan `data` branch.
# Scoring-code changes on main trigger a rebuild, so the app never pairs new
# code with a file built by the old code for up to a day.

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dashboard/lib/scoring.py
      - dashboard/lib/scores_export.py
      - dashboard/lib/proposed_scoring.py
      - dashboard/config/*/scoring.yaml
      - dashboard/config/*/scoring_proposed.yaml
      - dashboard/lib/pipeline.py
      - dashboard/lib/views_export.py
      - dashboard/lib/views_common.py
      - dashboard/lib/views_maintenance.py
      - dashboard/lib/redaction.py
      - dashboard/config/*/redact.yaml
      - scripts/build_scores.py
      - scripts/build_views.py

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: list
        run: |
          orgs=$(python scripts/list_tenants.py --kind health)
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"
        env:
          PYTHONPATH: ${{ github.workspace }}

  build:
    needs: discover
    if: ${{ needs.discover.outputs.orgs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.discover.outputs.orgs) }}
    concurrency:
      group: build-scores-${{ matrix.org }}
      cancel-in-progress: false
    env:
      ORG: ${{ matrix.org }}
      OUT_DIR: ${{ github.workspace }}/out/${{ matrix.org }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_scores.py --org "$ORG" --out-dir "$OUT_DIR"
        env:
          PYTHONPATH: ${{ github.workspace }}

      # collect-maintenance.yml also writes <org>/views, as often as every few minutes.
      # Views are built from the maintenance files in the clone being pushed, so a push
      # can only land on the state it was built from; a rejected push starts over.
      - name: Build views and publish to data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          clone_data_branch() {
            if git ls-remote --exit-code --heads origin data >/dev/null; then
              git clone --depth 1 --branch data "$remote" data-branch
            else
              git init -b data data-branch && git -C data-branch remote add origin "$remote"
            fi
          }
          publish() {
            rm -rf data-branch "$OUT_DIR/views"
            clone_data_branch || return 1
            python scripts/build_views.py --org "$ORG" --out-dir "$OUT_DIR/views" \
              --maintenance-dir "data-branch/$ORG/maintenance" || return 1
            mkdir -p "data-branch/$ORG" || return 1
            cp -R "$OUT_DIR"/. "data-branch/$ORG/" || return 1
            git -C data-branch add "$ORG" || return 1
            if git -C data-branch diff --cached --quiet; then
              echo "$ORG scores unchanged."
              return 0
            fi
            git -C data-branch commit -m "chore(data): update $ORG scores $(date -u +%F)" || return 1
            git -C data-branch push origin data
          }
          for attempt in 1 2 3; do
            publish && exit 0
            echo "Publish attempt $attempt failed; retrying from a fresh clone."
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
