name: Build scores

# Pre-computes scores and page-ready views (`views/`) from the
# openedx/wg-maintenance CSVs so readers render files instead of running
# scoring. Output goes to the orphan `data` branch:
# Scoring-code changes on main trigger a rebuild, so the app never pairs new
# code with a file built by the old code for up to a day.

on:
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - dashboard/lib/scoring.py
      - dashboard/lib/scores_export.py
      - dashboard/lib/proposed_scoring.py
      - dashboard/config/*/scoring.yaml
      - dashboard/config/*/scoring_proposed.yaml
      - dashboard/lib/pipeline.py
      - dashboard/lib/views_export.py
      - dashboard/lib/views_common.py
      - dashboard/lib/views_maintenance.py
      - dashboard/lib/redaction.py
      - dashboard/config/*/redact.yaml
      - scripts/build_scores.py
      - scripts/build_views.py

concurrency:
  group: build-scores
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: ${{ github.workspace }}/out/openedx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_scores.py --org openedx --out-dir "$OUT_DIR"
        env:
          PYTHONPATH: ${{ github.workspace }}

      # collect-maintenance.yml also writes openedx/views, as often as every few minutes.
      # Views are built from the maintenance files in the clone being pushed, so a push
      # can only land on the state it was built from; a rejected push starts over.
      - name: Build views and publish to data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          clone_data_branch() {
            if git ls-remote --exit-code --heads origin data >/dev/null; then
              git clone --depth 1 --branch data "$remote" data-branch
            else
              git init -b data data-branch && git -C data-branch remote add origin "$remote"
            fi
          }
          publish() {
            rm -rf data-branch "$OUT_DIR/views"
            clone_data_branch || return 1
            python scripts/build_views.py --org openedx --out-dir "$OUT_DIR/views" \
              --maintenance-dir data-branch/openedx/maintenance || return 1
            mkdir -p data-branch/openedx || return 1
            cp -R "$OUT_DIR"/. data-branch/openedx/ || return 1
            git -C data-branch add openedx || return 1
            if git -C data-branch diff --cached --quiet; then
              echo "Scores unchanged."
              return 0
            fi
            git -C data-branch commit -m "chore(data): update openedx scores $(date -u +%F)" || return 1
            git -C data-branch push origin data
          }
          for attempt in 1 2 3; do
            publish && exit 0
            echo "Publish attempt $attempt failed; retrying from a fresh clone."
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONPATH: ${{ github.workspace }}
