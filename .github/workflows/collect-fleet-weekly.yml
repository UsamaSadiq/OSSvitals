name: Collect fleet weekly signals

# Weekly: runs a fleet tenant's `clone` signals (today `conflicts`: blob-less clones of each fork and
# its upstream plus `git merge-tree`, no worktree checked out). Each signal publishes
# <org>/views/<signal>.json to the orphan `data` branch. Read-only for the tenant's repos.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

concurrency:
  group: collect-fleet-weekly-moneta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ORG: moneta
      OUT_DIR: ${{ github.workspace }}/out/fleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/collect_fleet.py --org "$ORG" --tier clone --out-dir "$OUT_DIR"
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to data branch
        # Runs after a failed collect too: a signal that failed for every fork wrote nothing, the others still publish.
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          views=("$OUT_DIR"/views/*.json)
          if [ ${#views[@]} -eq 0 ]; then
            echo "No weekly fleet signal wrote a view."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch
          mkdir -p "data-branch/$ORG/views"
          cp "${views[@]}" "data-branch/$ORG/views/"
          cd data-branch
          git add "$ORG/views"
          if git diff --cached --quiet; then
            echo "$ORG weekly signals unchanged."
            exit 0
          fi
          git commit -m "chore(data): update $ORG weekly fleet signals $(date -u +%F)"
          git push origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
