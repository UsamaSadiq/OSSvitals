name: Collect fleet weekly signals

# Weekly, for every fleet tenant in dashboard/config/tenants.json: runs the `clone` signals its
# fleet.yaml enables (today `conflicts`: blob-less clones of each fork and its upstream plus
# `git merge-tree`, no worktree checked out). Each signal publishes <org>/views/<signal>.json to
# the orphan `data` branch. Read-only for the tenant's repos.

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: list
        run: echo "orgs=$(python scripts/list_tenants.py --kind fleet)" >> "$GITHUB_OUTPUT"
        env:
          PYTHONPATH: ${{ github.workspace }}

  collect:
    needs: discover
    if: ${{ needs.discover.outputs.orgs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.discover.outputs.orgs) }}
    concurrency:
      group: collect-fleet-weekly-${{ matrix.org }}
      cancel-in-progress: false
    env:
      ORG: ${{ matrix.org }}
      OUT_DIR: ${{ github.workspace }}/out/fleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/collect_fleet.py --org "$ORG" --tier clone --out-dir "$OUT_DIR"
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to data branch
        # Runs after a failed collect too: a signal that failed for every fork wrote nothing, the others still publish.
        if: ${{ !cancelled() }}
        run: |
          shopt -s nullglob
          views=("$OUT_DIR"/views/*.json)
          if [ ${#views[@]} -eq 0 ]; then
            echo "No weekly fleet signal wrote a view."
            exit 0
          fi
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            rm -rf data-branch
            git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch || return 1
            mkdir -p "data-branch/$ORG/views" || return 1
            cp "${views[@]}" "data-branch/$ORG/views/" || return 1
            git -C data-branch add "$ORG/views" || return 1
            if git -C data-branch diff --cached --quiet; then
              echo "$ORG weekly signals unchanged."
              return 0
            fi
            git -C data-branch commit -m "chore(data): update $ORG weekly fleet signals $(date -u +%F)" || return 1
            git -C data-branch push origin data
          }
          for attempt in 1 2 3; do
            publish && exit 0
            echo "Publish attempt $attempt failed; retrying from a fresh clone."
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
