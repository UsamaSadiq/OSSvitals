name: Collect Moneta status

# Reads the public Pressingly forks and their upstreams through the GitHub API and publishes
# meta.json, apps.json and drift.json to moneta/views/ on the orphan `data` branch.
# Read-only: nothing here writes to Pressingly repos. This tenant does not use the CSV or scoring path.
# Publishing here does not redeploy the web app; the next Build scores run bundles the new files.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

concurrency:
  group: collect-moneta
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: ${{ github.workspace }}/out/moneta/views
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/collect_moneta.py --out-dir "$OUT_DIR"
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch
          mkdir -p data-branch/moneta/views
          cp -R "$OUT_DIR"/. data-branch/moneta/views/
          cd data-branch
          git add moneta/views
          if git diff --cached --quiet; then
            echo "Moneta data unchanged."
            exit 0
          fi
          git commit -m "chore(data): update moneta fork status $(date -u +%F)"
          git push origin data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
