name: Collect private fleet status

# Called from a private tenant's own runner repository, never run here: a called workflow logs to the
# caller's run, so private repo names and errors stay in that private repository. It checks out this
# repository, adds the caller's config/<org>/ folder as dashboard/config/<org>/, runs the fleet collector
# with the caller's per-owner tokens, and uploads the views to the private bucket the gate Worker serves.
# Nothing is written to the public `data` branch or the public bucket.

on:
  workflow_call:
    inputs:
      org:
        description: Private tenant org, as listed in dashboard/config/tenants.json.
        required: true
        type: string
      tier:
        description: "`api` (daily) or `clone` (weekly)."
        default: api
        type: string
      config_dir:
        description: Folder in the caller's repository that holds <org>/.
        default: config
        type: string
      ossvitals_ref:
        description: Ref of UsamaSadiq/OSSvitals to run.
        default: main
        type: string
      bucket:
        default: ossvitals-private-data
        type: string
    secrets:
      OWNER_TOKENS:
        description: 'JSON object of GitHub owner to read-only token, e.g. {"edly-io": "...", "PakistanX": "..."}.'
        required: true
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    concurrency:
      group: collect-private-${{ inputs.org }}-${{ inputs.tier }}
      cancel-in-progress: false
    env:
      ORG: ${{ inputs.org }}
      TIER: ${{ inputs.tier }}
      BUCKET: ${{ inputs.bucket }}
      OUT_ROOT: ${{ github.workspace }}/out
      PREVIOUS: ${{ github.workspace }}/previous
    defaults:
      run:
        working-directory: ossvitals
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UsamaSadiq/OSSvitals
          ref: ${{ inputs.ossvitals_ref }}
          path: ossvitals
      - uses: actions/checkout@v4
        with:
          path: tenant
      - name: Check the tenant is private and add its config
        env:
          CONFIG_DIR: ${{ github.workspace }}/tenant/${{ inputs.config_dir }}
        run: |
          visibility=$(jq -r --arg org "$ORG" '.[$org].visibility // "missing"' dashboard/config/tenants.json)
          if [ "$visibility" != "private" ]; then echo "::error::$ORG is not a private tenant in tenants.json ($visibility)"; exit 1; fi
          if [ "$TIER" != "api" ] && [ "$TIER" != "clone" ]; then echo "::error::unknown tier $TIER"; exit 1; fi
          if [ ! -d "$CONFIG_DIR/$ORG" ]; then echo "::error::no $ORG folder in the caller's ${{ inputs.config_dir }}/"; exit 1; fi
          cp -R "$CONFIG_DIR/$ORG" "dashboard/config/$ORG"
      - name: Let git clone each owner's private repos
        env:
          OWNER_TOKENS: ${{ secrets.OWNER_TOKENS }}
        run: |
          jq -r 'to_entries[] | "\(.key)\t\(.value)"' <<< "$OWNER_TOKENS" | while IFS=$'\t' read -r owner token; do
            echo "::add-mask::$token"
            git config --global "url.https://x-access-token:${token}@github.com/${owner}/.insteadOf" "https://github.com/${owner}/"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ossvitals/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ossvitals/web/package-lock.json
      - run: npm install --global wrangler@4.146.0
      - name: Fetch the previous run's files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p "$PREVIOUS/views" "$PREVIOUS/feeds"
          for key in views/drift.json views/drift_history.json feeds/kev.json; do
            wrangler r2 object get "$BUCKET/$ORG/$key" --file "$PREVIOUS/$key" --remote >/dev/null 2>&1 || echo "No previous $key"
          done
      - name: Collect
        run: python scripts/collect_fleet.py --org "$ORG" --tier "$TIER" --out-dir "$OUT_ROOT/$ORG" --previous-dir "$PREVIOUS/views" --feed-cache-dir "$PREVIOUS/feeds"
        env:
          PYTHONPATH: ${{ github.workspace }}/ossvitals
          GH_TOKEN: ${{ github.token }}
          GH_OWNER_TOKENS: ${{ secrets.OWNER_TOKENS }}
      # The clone tier writes only its own optional views, so the required ones are checked on the daily run.
      - name: Validate the views
        if: inputs.tier == 'api'
        working-directory: ossvitals/web
        run: |
          npm ci
          npm run validate-data -- --org "$ORG" --dir "$OUT_ROOT/$ORG/views"
      - name: Upload to the private bucket
        run: scripts/sync_r2.sh "$OUT_ROOT" "$BUCKET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
