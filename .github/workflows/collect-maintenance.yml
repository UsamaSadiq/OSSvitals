name: Collect maintenance signals

# Collects maintenance signals from public GitHub data (upgrade-job health, upgrade
# wave progress, package upgrade campaigns, redundant bot campaign PRs, the catalog-info.yaml snapshot) and publishes them to
# openedx/maintenance/ on the orphan `data` branch, next to the scores. Read-only:
# nothing here writes to openedx repos. The dashboard only reads these files.
#
# A dispatch with `repos` (from the ossvitals-events Worker in events/) re-collects only
# those repos and merges them into the published files; upgrade jobs stay on the daily run.

on:
  schedule:
    - cron: "53 8 * * *"
    # Hourly campaign-only refresh while the certifi PRs land (public-engineering#574).
    # The plan job stops it at CAMPAIGN_REFRESH_UNTIL; delete this line afterwards.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      repos:
        description: Space-separated bare repo names to refresh and merge; empty runs every repo.
        required: false
        default: ""

# Shared with build-scores.yml: both write openedx/views, so one must finish
# (fetch, build, push) before the other starts.
concurrency:
  group: openedx-data
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  HOURLY_CRON: "23 * * * *"
  CAMPAIGN_REFRESH_UNTIL: "2026-10-23T19:00:00Z"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.plan.outputs.run }}
      collectors: ${{ steps.plan.outputs.collectors }}
      scope: ${{ steps.plan.outputs.scope }}
    steps:
      - id: plan
        env:
          SCHEDULE: ${{ github.event.schedule }}
          REPOS: ${{ github.event.inputs.repos }}
        run: |
          set -f
          if [ -n "$REPOS" ]; then
            args="--merge"
            for repo in $REPOS; do
              if ! [[ "$repo" =~ ^[A-Za-z0-9._-]+$ ]]; then
                echo "::error::Not a bare repo name: $repo"
                exit 1
              fi
              args="$args --repo $repo"
            done
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "collectors=$args" >> "$GITHUB_OUTPUT"
            echo "scope=$(wc -w <<< "$REPOS" | tr -d ' ') changed repos" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" != "$HOURLY_CRON" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%s)" -lt "$(date -u -d "$CAMPAIGN_REFRESH_UNTIL" +%s)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "collectors=--collector campaigns" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      OUT_DIR: ${{ github.workspace }}/out/openedx/maintenance
      VIEWS_DIR: ${{ github.workspace }}/out/openedx/views
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-collectors.txt
      # A campaign-only run rebuilds every view, so start from the published files.
      - name: Seed with published maintenance files
        run: |
          git fetch --depth 1 origin data
          mkdir -p "$OUT_DIR"
          git archive FETCH_HEAD openedx/maintenance | tar -x --strip-components=2 -C "$OUT_DIR"
      - run: python scripts/collect_maintenance.py --out-dir "$OUT_DIR" ${{ needs.plan.outputs.collectors }}
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Views that read these files are rebuilt here, from today's files, rather
      # than waiting for tomorrow's build-scores run.
      - run: python scripts/build_views.py --org openedx --out-dir "$VIEWS_DIR" --maintenance-dir "$OUT_DIR"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Publish to data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other collectors push to `data` too; a rejected push starts again from a fresh clone.
          publish() {
            rm -rf data-branch
            git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch
            mkdir -p data-branch/openedx/maintenance data-branch/openedx/views
            cp -R "$OUT_DIR"/. data-branch/openedx/maintenance/
            cp -R "$VIEWS_DIR"/. data-branch/openedx/views/
            git -C data-branch add openedx/maintenance openedx/views
            if git -C data-branch diff --cached --quiet; then
              echo "Maintenance data unchanged."
              return 0
            fi
            git -C data-branch commit -m "chore(data): update openedx maintenance signals $(date -u +%F)${SCOPE:+ ($SCOPE)}"
            git -C data-branch push origin data
          }
          for attempt in 1 2 3; do
            publish && exit 0
            echo "Push attempt $attempt was rejected; retrying."
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOPE: ${{ needs.plan.outputs.scope }}
