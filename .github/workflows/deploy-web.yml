name: Deploy web

on:
  pull_request:
    paths:
      - web/**
      - scripts/data_branch_export.sh
      - .github/workflows/deploy-web.yml
  push:
    branches: [main]
    paths:
      - web/**
      - scripts/data_branch_export.sh
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-web-pr-{0}', github.ref) || 'deploy-web' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Fetch data
        working-directory: .
        run: scripts/data_branch_export.sh web/public/data
      - run: npm run validate-data
      - run: npm run build
        env:
          VITE_DATA_BASE: https://data.ossvitals.org
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          wranglerVersion: "4.146.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: deploy
