name: Collect fleet status

# For every fleet tenant in dashboard/config/tenants.json: reads its public forks and their
# upstreams through the GitHub API (the daily `api` signals its fleet.yaml enables) and publishes
# views/, badges/ and VERSIONS.md to <org>/ on the orphan `data` branch. The drift history is
# extended from the previous run's file. Read-only: nothing here writes to the tenant's repos.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.list.outputs.orgs }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: list
        run: |
          orgs=$(python scripts/list_tenants.py --kind fleet)
          echo "orgs=$orgs" >> "$GITHUB_OUTPUT"
        env:
          PYTHONPATH: ${{ github.workspace }}

  collect:
    needs: discover
    if: ${{ needs.discover.outputs.orgs != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        org: ${{ fromJSON(needs.discover.outputs.orgs) }}
    concurrency:
      group: collect-fleet-${{ matrix.org }}
      cancel-in-progress: false
    env:
      ORG: ${{ matrix.org }}
      OUT_DIR: ${{ github.workspace }}/out/fleet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch the previous views
        run: git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-previous
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/collect_fleet.py --org "$ORG" --out-dir "$OUT_DIR" --previous-dir "data-previous/$ORG/views" --feed-cache-dir "data-previous/$ORG/feeds"
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Other orgs and collectors push to `data` too; a rejected push starts again from a fresh clone.
          publish() {
            rm -rf data-branch
            git clone --depth 1 --branch data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch || return 1
            mkdir -p "data-branch/$ORG" || return 1
            cp -R "$OUT_DIR"/. "data-branch/$ORG/" || return 1
            git -C data-branch add "$ORG" || return 1
            if git -C data-branch diff --cached --quiet; then
              echo "$ORG data unchanged."
              return 0
            fi
            git -C data-branch commit -m "chore(data): update $ORG fork status $(date -u +%F)" || return 1
            git -C data-branch push origin data
          }
          for attempt in 1 2 3; do
            publish && exit 0
            echo "Publish attempt $attempt failed; retrying from a fresh clone."
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
