name: Sync data to R2

# Mirrors each tenant's views/ and maintenance/ folders from the `data` branch into the
# public ossvitals-data R2 bucket after every collector run. The web app reads them from
# https://data.ossvitals.org, so new data is live within a minute without rebuilding the
# site. Pushes made with GITHUB_TOKEN do not trigger workflows, hence workflow_run.

on:
  workflow_run:
    workflows: ["Build scores", "Collect maintenance signals", "Collect fleet status", "Collect fleet weekly signals"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-data
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUCKET: ossvitals-data

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global wrangler@4.146.0
      - run: scripts/data_branch_export.sh "$RUNNER_TEMP/data"
      # A file that fails the schemas never reaches the bucket, so the site keeps the last good copy.
      - name: Validate openedx views
        working-directory: web
        run: |
          npm ci
          npm run validate-data -- --org openedx --dir "$RUNNER_TEMP/data/openedx/views"
      - run: scripts/sync_r2.sh "$RUNNER_TEMP/data" "$BUCKET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
