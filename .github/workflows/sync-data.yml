name: Sync data to R2

# Mirrors each tenant's views/ and maintenance/ folders from the `data` branch into the
# public ossvitals-data R2 bucket after every collector run. The web app reads them from
# https://data.ossvitals.org, so new data is live within a minute without rebuilding the
# site. Pushes made with GITHUB_TOKEN do not trigger workflows, hence workflow_run.

on:
  workflow_run:
    workflows: ["Build scores", "Collect maintenance signals", "Collect fleet status", "Collect fleet weekly signals"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-data
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUCKET: ossvitals-data

jobs:
  sync:
    # A failed run may still have published: fleet matrix legs and weekly signals publish on their own.
    # The mirror re-uploads the current `data` head, so it is safe after failures too.
    if: github.event_name != 'workflow_run' || contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global wrangler@4.146.0
      - run: scripts/data_branch_export.sh "$RUNNER_TEMP/data"
      # A tenant whose views fail their schemas keeps its last good copy in the bucket: --prune leaves its folder
      # out of this upload (exit 3), the other tenants still sync, and the run fails afterwards so it gets noticed.
      # Any other non-zero exit means the check itself broke, so nothing is uploaded.
      - name: Validate every tenant's views
        id: validate
        working-directory: web
        run: |
          npm ci
          status=0
          npm run validate-data -- --root "$RUNNER_TEMP/data" --prune || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then exit "$status"; fi
          echo "pruned=$([ "$status" -eq 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: scripts/sync_r2.sh "$RUNNER_TEMP/data" "$BUCKET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.validate.outputs.pruned == 'true'
        run: |
          echo "::error::Some tenants' views failed validation and were not uploaded; see the validate step."
          exit 1
