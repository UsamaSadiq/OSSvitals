name: Report a bug
description: Something on a dashboard or the MCP server is broken or behaves unexpectedly.
title: "[bug] "
labels: ["bug"]
body:
  - type: input
    id: tenant
    attributes:
      label: Tenant
      description: The dashboard this is about, for example moneta or openedx.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page
      description: Link to the dashboard page, if any.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: The repository or app this is about, if any.
  - type: input
    id: data_date
    attributes:
      label: Data date
      description: The snapshot date shown on the dashboard.
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
