# Defaults for every health tenant. A tenant overrides any key in dashboard/config/<org>/health.yaml;
# mappings merge key by key, lists replace.
version: 1
# Web routes the tenant's site shows; the nav and direct links hide the rest.
pages:
  - /
  - /repos
  - /repo_detail
  - /failing_checks
  - /what_changed
  - /needing_attention
  - /at_risk
  - /ownership_views
  - /maintenance
  - /support_window
  - /platform
  - /components
  - /glossary
  - /scoring
# Maintenance collectors (scripts/collect_maintenance.py). The ones that work for any GitHub org are on;
# the Open edX ecosystem ones (edx-repo-tools upgrade jobs, the Backstage catalog, Tutor support
# windows) are off until a tenant turns them on.
collectors:
  upgrade_jobs: false
  waves: true
  campaigns: true
  redundant_prs: true
  catalog: false
  fix_prs: true
  support_windows: false
  modularization: false
  platform_trends: false
  extension_points: false
# A page left out of meta.json pages while the collector it shows is off.
page_collectors:
  /components: catalog
  /support_window: support_windows
  /platform: modularization
