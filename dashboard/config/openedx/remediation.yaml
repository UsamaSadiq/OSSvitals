checks:
  dependabot.exists:
    title: "Add Dependabot configuration"
    description: "Dependabot keeps dependency versions fresh and security alerts visible."
    source_url: "https://github.com/openedx/.github/blob/master/.github/dependabot.yml"
    snippet: |
      version: 2
      updates:
        - package-ecosystem: "pip"
          directory: "/"
          schedule:
            interval: "weekly"
    applies_to_tiers: ["critical", "important", "standard"]
    chaoss_metric: "Maintained"
    scorecard_check: "Dependency-Update-Tool"
    issue_body_template: |
      This repository currently fails the `dependabot.exists` health check.

      Proposed fix:
      1. Add a `.github/dependabot.yml` file.
      2. Start with weekly updates for pip/npm ecosystems used by this repo.

      Filed via the Open edX Repository Health Dashboard ({dashboard_url}) - please review and edit before submitting.
  exists.openedx.yaml:
    title: "Add openedx.yaml"
    description: "This metadata file is required for repository ownership and governance context."
    source_url: "https://docs.openedx.org/"
    snippet: |
      owner: "team-name"
      maintainers:
        - github-handle
      tags:
        - openedx
    applies_to_tiers: ["critical", "important", "standard"]
    issue_body_template: |
      This repository currently fails the `exists.openedx.yaml` health check.

      Please add an `openedx.yaml` with ownership and maintainer metadata.

      Filed via the Open edX Repository Health Dashboard ({dashboard_url}) - please review and edit before submitting.
  github_actions:
    title: "Enable GitHub Actions CI"
    description: "Repositories should use GitHub Actions as the primary CI signal."
    source_url: "https://github.com/openedx/.github/tree/master/.github/workflows"
    snippet: |
      name: CI
      on:
        pull_request:
        push:
          branches: [main]
      jobs:
        test:
          runs-on: ubuntu-latest
          steps:
            - uses: actions/checkout@v4
            - run: echo "Add your tests here"
    applies_to_tiers: ["critical", "important", "standard"]
    scorecard_check: "CI-Tests"
    issue_body_template: |
      This repository currently fails the `github_actions` health check.

      Proposed fix is to add a baseline CI workflow under `.github/workflows`.

      Filed via the Open edX Repository Health Dashboard ({dashboard_url}) - please review and edit before submitting.
  exists..editorconfig:
    title: "Add the shared .editorconfig"
    description: "The edx-lint generated .editorconfig makes every editor agree on indentation, line endings and charset."
    source_url: "https://github.com/openedx/.github/blob/master/.editorconfig"
    snippet: |
      gh api repos/openedx/.github/contents/.editorconfig -H 'Accept: application/vnd.github.raw' > .editorconfig
    applies_to_tiers: ["critical", "important", "standard"]
    issue_body_template: |
      This repository currently fails the `exists..editorconfig` health check.

      Proposed fix: copy the edx-lint generated `.editorconfig` from openedx/.github unchanged (hash comment included), so `edx_lint check` recognises it. Repo-specific tweaks belong in `.editorconfig_tweaks`.

      Filed via the Open edX Repository Health Dashboard ({dashboard_url}) - please review and edit before submitting.
  makefile.test-python:
    title: "Add a test-python make target"
    description: "The Open edX repo health checks look for a test-python target; an alias of the existing test target satisfies it without changing how tests run."
    source_url: "https://github.com/openedx/edx-cookiecutters/blob/master/cookiecutter-django-app/%7B%7Bcookiecutter.repo_name%7D%7D/Makefile"
    snippet: |
      test-python: test ## Alias kept for the Open edX repo health checks
    applies_to_tiers: ["critical", "important", "standard"]
    issue_body_template: |
      This repository currently fails the `makefile.test-python` health check.

      Proposed fix: add `test-python` as an alias of the existing test target and list it in `.PHONY`.

      Filed via the Open edX Repository Health Dashboard ({dashboard_url}) - please review and edit before submitting.
  makefile.quality-python:
    title: "Add a quality-python make target"
    description: "The Open edX repo health checks look for a quality-python target; an alias of the existing quality target satisfies it without changing how linting runs."
    source_url: "https://github.com/openedx/edx-cookiecutters/blob/master/cookiecutter-django-app/%7B%7Bcookiecutter.repo_name%7D%7D/Makefile"
    snippet: |
      quality-python: quality ## Alias kept for the Open edX repo health checks
    applies_to_tiers: ["critical", "important", "standard"]
    issue_body_template: |
      This repository currently fails the `makefile.quality-python` health check.

      Proposed fix: add `quality-python` as an alias of the existing quality target and list it in `.PHONY`.

      Filed via the Open edX Repository Health Dashboard ({dashboard_url}) - please review and edit before submitting.
  tox_ini.uses_whitelist_externals:
    title: "Rename whitelist_externals to allowlist_externals"
    description: "tox deprecated whitelist_externals in 3.18 in favour of allowlist_externals. Rename the key and reword any comment that still names the old one, since the upstream check matches the text anywhere in the file."
    source_url: "https://tox.wiki/en/latest/config.html#allowlist_externals"
    snippet: |
      [testenv]
      allowlist_externals =
          make
    applies_to_tiers: ["critical", "important", "standard"]
    issue_body_template: |
      This repository currently fails the `tox_ini.uses_whitelist_externals` health check.

      Proposed fix: rename `whitelist_externals` to `allowlist_externals` in `tox.ini`, and reword any comment that still names the old key: the upstream check matches the substring anywhere in the file.

      Filed via the Open edX Repository Health Dashboard ({dashboard_url}) - please review and edit before submitting.
